name: Publish signed El Grande Android APK

on:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Import private Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EL_GRANDE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing signing keystore secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/el-grande-release.jks"
          chmod 600 "$RUNNER_TEMP/el-grande-release.jks"
      - name: Build signed release APK
        working-directory: android
        env:
          EL_GRANDE_KEYSTORE: ${{ runner.temp }}/el-grande-release.jks
          EL_GRANDE_STORE_PASSWORD: ${{ secrets.EL_GRANDE_STORE_PASSWORD }}
          EL_GRANDE_KEY_ALIAS: ${{ secrets.EL_GRANDE_KEY_ALIAS }}
          EL_GRANDE_KEY_PASSWORD: ${{ secrets.EL_GRANDE_KEY_PASSWORD }}
        run: |
          test -n "$EL_GRANDE_STORE_PASSWORD"
          test -n "$EL_GRANDE_KEY_ALIAS"
          test -n "$EL_GRANDE_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Publish website-downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/app-release.apk#el-grande-android.apk --title "El Grande Android $GITHUB_REF_NAME" --notes "Standalone Android APK with local El Grande records."
