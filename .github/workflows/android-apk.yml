name: El Grande Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - 'integrations/all_by_devoll/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build offline-capable APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK for website distribution
        uses: actions/upload-artifact@v4
        with:
          name: el-grande-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check Python syntax
        run: python -m compileall -q integrations/all_by_devoll android/app/src/main/python
