name: El Grande Zorin installer
on:
  push:
    paths:
      - 'packaging/**'
      - 'integrations/all_by_devoll/**'
      - '.github/workflows/el-grande-installer.yml'
  pull_request:
    paths:
      - 'packaging/**'
      - 'integrations/all_by_devoll/**'
      - '.github/workflows/el-grande-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF rendering library
        run: python3 -m pip install reportlab
      - name: Compile and test Python
        run: |
          python3 -m compileall -q integrations/all_by_devoll packaging
          python3 -m unittest discover -s integrations/all_by_devoll -p 'test_*.py' -v
      - name: Package and inspect the Python-only installer
        run: |
          bash packaging/build-deb.sh
          dpkg-deb -I artifacts/el-grande_0.14.0_all.deb
          dpkg-deb -c artifacts/el-grande_0.14.0_all.deb | grep -E 'el-grande-launcher.py|desk.py|el-grande.desktop'
      - name: Exercise installed workflows
        run: bash packaging/smoke-standalone.sh artifacts/el-grande_0.14.0_all.deb
      - name: Upload double-click installer
        uses: actions/upload-artifact@v4
        with:
          name: el-grande-zorin-deb
          path: artifacts/el-grande_0.14.0_all.deb
          retention-days: 14
