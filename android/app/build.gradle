plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.tomeygeneral.elgrande'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tomeygeneral.elgrande'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '0.14.0-android.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.12'
    }
    sourceSets {
        main {
            srcDirs = ['src/main/python', '../../integrations/all_by_devoll']
        }
    }
}
